name: Build Windows exe

# main = versão madura (gera instalador + releases "latest" e vX.Y.Z, que os colegas descarregam)
# dev  = desenvolvimento (gera só artefactos para testar; NÃO toca nas releases)
on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(grep -oP 'VERSION = \"\K[^\"]+' app.py)" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Gerar executável
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FlightTracker --icon installer/icon.ico
          --add-data "ui;ui" --add-data "data;data" --collect-all duckdb --collect-all webview --collect-all pptx
          --hidden-import openpyxl --hidden-import tkinter app.py
      - name: Criar instalador (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:V installer\FlightTracker.iss
          Copy-Item "dist\FlightTracker-Setup-$env:V.exe" "dist\FlightTracker-Setup.exe"
          # instalador dentro de um zip: as redes empresariais bloqueiam o download direto de .exe, mas deixam passar .zip
          Compress-Archive -Path "dist\FlightTracker-Setup-$env:V.exe" -DestinationPath "dist\FlightTracker-Setup-$env:V.zip"
          Copy-Item "dist\FlightTracker-Setup-$env:V.zip" "dist\FlightTracker-Setup.zip"
      - name: Pasta portátil (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\FlightTracker -DestinationPath dist\FlightTracker-windows-portable.zip
      - name: Publicar artefacto (pasta FlightTracker com o .exe dentro)
        uses: actions/upload-artifact@v4
        with:
          name: FlightTracker-windows
          path: dist/FlightTracker
      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FlightTracker-Setup
          path: dist/FlightTracker-Setup-*.exe
      - name: Limpar da release "latest" os instaladores das versões 1–3 (ficam nas releases próprias)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.assets[] | select(.name | startswith("Flight.Track.Viewer_")) | .id' 2>/dev/null); do
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id && echo "removido $id"
          done
      - name: Release "latest" (links fixos usados no e-mail de novidades)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FlightTracker — versão mais recente
          body: |
            Instalador Windows (dentro de um zip, para passar nos filtros de rede), pasta portátil e DMG macOS da versão mais recente (${{ env.V }}).
            Instala por cima da versão anterior — a base de dados importada mantém-se.
          files: |
            dist/FlightTracker-Setup.zip
            dist/FlightTracker-Setup.exe
            dist/FlightTracker-windows-portable.zip
          make_latest: true
      - name: Release da versão ${{ env.V }}
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: FlightTracker ${{ env.V }}
          body: Ver histórico de versões na app (Preferências → Histórico de versões) ou em data/changelog.json.
          files: |
            dist/FlightTracker-Setup-${{ env.V }}.zip
            dist/FlightTracker-Setup-${{ env.V }}.exe
          make_latest: false

  macos:
    needs: version
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Gerar FlightTracker.app
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FlightTracker --icon installer/icon.icns
          --osx-bundle-identifier pt.nav.goplis.flighttracker
          --add-data "ui:ui" --add-data "data:data" --collect-all duckdb --collect-all webview --collect-all pptx
          --hidden-import openpyxl --hidden-import tkinter app.py
      - name: Criar DMG
        run: |
          mkdir -p dmg && cp -R dist/FlightTracker.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "FlightTracker $V" -srcfolder dmg -ov -format UDZO "dist/FlightTracker-$V-macOS.dmg"
          cp "dist/FlightTracker-$V-macOS.dmg" dist/FlightTracker-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FlightTracker-macOS
          path: dist/FlightTracker-*-macOS.dmg
      - name: Release "latest" (macOS)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: dist/FlightTracker-macOS.dmg
      - name: Release da versão ${{ env.V }} (macOS)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          files: dist/FlightTracker-${{ env.V }}-macOS.dmg
          make_latest: false
