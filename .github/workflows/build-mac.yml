name: Criar DMG para macOS (Tauri)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download do código
        uses: actions/checkout@v4

      - name: Injectar API Key no HTML
        run: |
          KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          if [ -n "$KEY" ]; then
            sed -i '' "s|__ANTHROPIC_API_KEY__|${KEY}|g" dist/index.html
            echo "API Key injectada com sucesso."
          else
            echo "Secret ANTHROPIC_API_KEY nao definido — placeholder mantido."
          fi

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@1

      - name: Build Tauri (DMG)
        run: tauri build --bundles dmg
        env:
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Guardar DMG como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Track-Viewer-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Publicar GitHub Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Flight Track Viewer — versão mais recente
          body: |
            Instalador Windows e DMG macOS da versão mais recente.
            Instala directamente sobre versão anterior — dados e sessão preservados.
          files: src-tauri/target/release/bundle/dmg/*.dmg
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
